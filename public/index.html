<script>
/* theme, resolved before first paint so there is no flash on load or between routes */
(function(){try{
  var t=localStorage.getItem('uor-theme');
  document.documentElement.dataset.theme =
    t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}catch(e){document.documentElement.dataset.theme='light';}})();
</script>
<script>
/* GitHub Pages serves 404.html for deep links; 404.html re-encodes the path into a
   query string and this turns it back into a real URL before React Router boots. */
(function(l){
  if (l.search[1] === '/') {
    var decoded = l.search.slice(1).split('&').map(function(s){
      return s.replace(/~and~/g, '&');
    }).join('?');
    window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
  }
}(window.location));
</script>
